<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Random joke generator powered by JokeAPI.">
  <title>Random Joke Generator | Neil Construction Company</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f172a;
      --navy-light: #1e293b;
      --gold: #c59b27;
      --gold-dark: #9f7c17;
      --cream: #fffdf7;
      --muted: #64748b;
      --white: #ffffff;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--navy), #253653);
      color: var(--navy);
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    .joke-shell {
      width: min(720px, 100%);
      background: var(--white);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .25);
    }

    .joke-header {
      padding: 34px 36px;
      color: var(--white);
      background: var(--navy);
      border-bottom: 4px solid var(--gold);
    }

    .brand {
      color: var(--gold);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.05; }
    .subtitle { color: #cbd5e1; margin-top: 12px; }

    .joke-content { padding: 36px; }

    .joke-card {
      min-height: 220px;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      background: var(--cream);
      border: 1px solid #f1e5bb;
      border-radius: 18px;
    }

    .joke-text {
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      line-height: 1.55;
      white-space: pre-line;
    }

    .joke-type {
      color: var(--gold-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 24px;
    }

    select, button {
      min-height: 50px;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
    }

    select {
      flex: 1;
      padding: 0 14px;
      color: var(--navy);
      background: var(--white);
      border: 1px solid var(--border);
    }

    button {
      padding: 0 22px;
      color: var(--white);
      background: var(--gold);
      border: 0;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    button:hover:not(:disabled), button:focus-visible:not(:disabled) {
      background: var(--gold-dark);
      transform: translateY(-1px);
    }

    button:disabled { cursor: wait; opacity: .65; }
    .status { min-height: 24px; margin-top: 16px; color: var(--muted); font-size: .9rem; }
    .error { color: #b91c1c; }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--gold-dark);
      font-weight: 700;
    }

    @media (max-width: 560px) {
      .joke-header, .joke-content { padding: 26px 20px; }
      .controls { align-items: stretch; flex-direction: column; }
      select, button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="joke-shell">
    <header class="joke-header">
      <div class="brand">Neil Construction Company</div>
      <h1>Random Joke Generator</h1>
      <p class="subtitle">A little laughter between projects, powered by JokeAPI.</p>
    </header>

    <section class="joke-content" aria-live="polite">
      <div class="joke-card">
        <div>
          <div id="jokeType" class="joke-type">Ready for a joke?</div>
          <p id="jokeText" class="joke-text">Click the button to load a random joke.</p>
        </div>
      </div>

      <div class="controls">
        <label class="sr-only" for="category">Joke category</label>
        <select id="category">
          <option value="Any">Any category</option>
          <option value="Programming">Programming</option>
          <option value="Misc">Miscellaneous</option>
          <option value="Pun">Puns</option>
          <option value="Spooky">Spooky</option>
          <option value="Christmas">Christmas</option>
        </select>
        <button id="jokeButton" type="button">Tell me a joke</button>
      </div>

      <p id="status" class="status" role="status"></p>
      <a class="back-link" href="index.html">← Back to Neil Construction Company</a>
    </section>
  </main>

  <script src="joke-generator.js"></script>
</body>
</html>
